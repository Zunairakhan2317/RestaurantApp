<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us | Geschmack Gang</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css"
    />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <link rel="stylesheet" href="css/contact.css" />
  </head>
  <body>
    <!-- Header / Navbar -->
    <header>
      <nav id="navbar"></nav>
    </header>

    <!-- Main Content -->
    <main>
      <!-- Hero Section -->
      <section class="contact-hero">
        <div class="hero-overlay"></div>
        <div class="hero-content" data-aos="fade-up" data-aos-duration="900">
          <h1>Contact Us</h1>
          <p>We’d love to hear from you</p>
        </div>
      </section>

      <!-- Contact Form Section -->
      <section class="contact-section" id="tablereserve">
        <h2 data-aos="fade-up" data-aos-duration="800">Get in Touch</h2>
        <form id="contactForm" novalidate>
          <div class="form-group">
            <label for="name">Name *</label>
            <input type="text" id="name" name="name" required />
            <small class="error-message"></small>
          </div>
          <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" required />
            <small class="error-message"></small>
          </div>
          <div class="form-group">
            <label for="subject">Subject *</label>
            <input type="text" id="subject" name="subject" required />
            <small class="error-message"></small>
          </div>
          <div class="form-group">
            <label for="message">Message *</label>
            <textarea id="message" name="message" rows="5" required></textarea>
            <small class="error-message"></small>
          </div>
          <button type="submit" class="cta-btn">Send Message</button>
        </form>
      </section>

      <!-- Contact Information Section -->
      <section class="contact-info">
        <h2 data-aos="fade-up" data-aos-duration="800">Contact Information</h2>
        <div class="info-grid">
          <article
            class="info-card"
            data-aos="fade-up"
            data-aos-duration="800"
            data-aos-delay="100"
          >
            <h3>Address</h3>
            <p>123 Food Street, Hyderabad, Sindh, Pakistan</p>
          </article>
          <article
            class="info-card"
            data-aos="fade-up"
            data-aos-duration="800"
            data-aos-delay="150"
          >
            <h3>Phone</h3>
            <p><a href="tel:+923001234567">+92 300 1234567</a></p>
          </article>
          <article
            class="info-card"
            data-aos="fade-up"
            data-aos-duration="800"
            data-aos-delay="200"
          >
            <h3>Email</h3>
            <p>
              <a href="mailto:info@geschmackgang.com">info@geschmackgang.com</a>
            </p>
          </article>
        </div>
      </section>

      <!-- Map Section -->
      <section class="map-section">
        <h2 data-aos="fade-up" data-aos-duration="800">Our Location</h2>
        <div class="map-container">
          <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3614.9144419391865!2d67.0099!3d24.7964!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3eb33e06bbbfffff%3A0x562bc28ae19f0e5b!2sHyderabad%2C%20Sindh!5e0!3m2!1sen!2s!4v1234567890"
            width="100%"
            height="400"
            style="border: 0"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
          ></iframe>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer id="footer"></footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script src="js/loader.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/contact.js"></script>
  </body>
</html>
